name: e2e

on:
  push:
    branches:
      - main
      - develop
      - 'feat-**'
      - 'fix-**'
      - 'docs-**'
      - 'perf-**'
      - 'test-**'
      - 'chore-**'
  workflow_dispatch:
    inputs:
      sessions:
        description: Perf scale sessions for the optional large run
        required: false
        default: '1000'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TERM: xterm-256color
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Show terminal environment
        run: |
          locale
          echo "TERM=$TERM LANG=$LANG LC_ALL=$LC_ALL"
          tmux -V

      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Install pnpm globally
        run: npm install -g pnpm@11.9.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install locked opencode binary
        run: |
          mkdir -p /tmp/oc-bin
          curl -fsSL -o /tmp/oc-bin/opencode.tar.gz \
            https://github.com/anomalyco/opencode/releases/download/v1.18.18/opencode-linux-x64.tar.gz
          tar -xzf /tmp/oc-bin/opencode.tar.gz -C /tmp/oc-bin
          chmod +x /tmp/oc-bin/opencode
          echo "DSH_OC_OPENCODE_BIN=/tmp/oc-bin/opencode" >> "$GITHUB_ENV"

      - name: Debug dsh plugin pnpm
        run: |
          export DSH_HOME=/tmp/dsh-debug
          mkdir -p "$DSH_HOME"
          dsh plugin --profile oc add /home/runner/work/dsh-oc/dsh-oc 2>&1 | tail -20 || true
          echo "--- manual pnpm install ---"
          (cd "$DSH_HOME/profiles/oc" && pnpm install 2>&1 | tail -40) || true
          echo "--- manual pnpm add mock-server ---"
          (cd "$DSH_HOME/profiles/oc" && pnpm add @deepseek-ai/dsh-llm-mock-server@0.1.0-rc.6 2>&1 | tail -60) || true

      - name: TUI turn diagnostic
        if: github.event_name == 'push'
        run: bash scripts/e2e-tui-turn.sh

      - name: Full e2e + perf scale (manual)
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/check-all.sh --e2e --scale ${{ github.event.inputs.sessions }}

      - name: Upload e2e runs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runs
          path: .e2e
          retention-days: 3
